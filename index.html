<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudios Bíblicos</title>
    <link rel="stylesheet" href="css/estilo-base.css">
    <style>
        .indice {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .indice h1 {
            border-bottom: none;
        }
        .indice ul {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }
        .indice ul li {
            margin: 15px 0;
            padding: 12px;
            background: #f8f4ee;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .indice ul li:hover {
            background: #f0e6d8;
            transform: scale(1.02);
        }
        .indice ul li a {
            text-decoration: none;
            color: #5a2d0c;
            font-size: 1.2em;
            font-weight: bold;
            display: block;
        }
        .indice ul li a:hover {
            color: #8b5a2b;
        }
        .indice .fecha {
            font-size: 0.8em;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="indice">
        <h1>📖 Estudios Bíblicos</h1>
        <p style="color: #555; margin-top: -10px;">"Escudriñad las Escrituras" (Juan 5:39)</p>
        
        <ul>
            <li>
                <a href="estudios/domingo-ramos.html">🌿 Domingo de Ramos - Jesús en el burro</a>
                <div class="fecha">Semana Santa 2026</div>
            </li>
            <!-- Aquí agregarás más estudios -->
        </ul>
        
        <p style="margin-top: 30px; font-size: 0.9em; color: #888;">
            Proximamente más estudios...
        </p>
    </div>
</body>
</html>
