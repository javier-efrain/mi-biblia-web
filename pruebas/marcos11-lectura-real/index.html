<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcos 11 · Prueba de lectura</title><style>
:root{font-family:system-ui,Arial,sans-serif;background:#f5f2eb;color:#25372d}*{box-sizing:border-box}body{margin:0}header{background:#203d34;color:white;padding:20px}header div,main{max-width:820px;margin:auto}h1{margin:0}header p{margin:5px 0 0}main{padding:18px 14px 70px}button{font:inherit;cursor:pointer;border:1px solid #bdc7c0;border-radius:9px;padding:9px 12px;background:white;color:#254435;font-weight:650}.active{background:#23523e;color:white}.mode{display:flex;gap:8px;margin:14px 0}.mode button{flex:1}.block{border-bottom:1px solid #d6d7cf;padding:18px 0}.block h2{margin:0 0 12px}.verse{font-family:Georgia,serif;font-size:19px;line-height:1.8;margin:0 0 10px}.verse sup{font:700 12px Arial;color:#8b6239;margin-right:7px}.resource{margin:18px 0;background:white;border:1px solid #d7dcd6;padding:14px;border-radius:14px}.resource h3{margin:0 0 7px}.sub{color:#58665e;font-size:14px}.viewport{max-width:440px;margin:auto;aspect-ratio:4/5;overflow:auto;border-radius:10px;background:#e6e4d9;overscroll-behavior:contain}.inner{position:relative}.inner img{position:absolute;left:0;top:0;max-width:none;pointer-events:none}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.zoom{display:grid;grid-template-columns:auto 30px minmax(0,1fr) 30px 44px;gap:5px;align-items:center;padding:8px;background:#f0f4f0;border-radius:10px}.zoom input{width:100%;min-width:0}.zoom button{padding:5px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:15px 0}.tabs button{font-size:13px;padding:9px 3px}.tabs .active[data-t=contexto]{background:#20654a}.tabs .active[data-t=exegesis]{background:#214e9b}.tabs .active[data-t=aplicacion]{background:#9c432d}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{font-size:13px}.detail{margin-top:12px;padding:13px;border:2px solid #7aa28c;border-radius:10px;background:#edf6ee;line-height:1.6}.detail.exegesis{background:#e5efff;border-color:#3668ad;color:#152e58}.detail.aplicacion{background:#fff0e9;border-color:#b55b3e;color:#592a1a}.error{padding:12px;background:#fff0e7;border-radius:8px;color:#763d24}.hidden{display:none!important}small{color:#68766d}@media(max-width:380px){.zoom{grid-template-columns:auto 27px minmax(0,1fr) 27px 40px;gap:3px}.zoom label{font-size:12px}}
</style></head><body><header><div><h1>Marcos 11 · Lectura integrada</h1><p>Texto bíblico RVC del lector de Mi Biblia Web</p></div></header><main><div class="mode"><button id="visual" class="active">Con recursos visuales</button><button id="solo">Solo texto bíblico</button></div><p id="status">Cargando Marcos 11…</p><div id="chapter"></div></main><script>
const blocks=[{a:1,b:11,title:"La entrada en Jerusalén",kind:"entrada",start:0},{a:12,b:14,title:"La higuera sin fruto",kind:"higuera",start:0},{a:15,b:19,title:"Jesús en el templo",kind:"templo",start:0},{a:20,b:26,title:"La higuera seca y la enseñanza de Jesús",kind:"higuera",start:1},{a:27,b:33,title:"La autoridad de Jesús es cuestionada"}];
const assets={entrada:{name:"La entrada en Jerusalén",src:"assets/entrada.webp",n:1},higuera:{name:"La higuera: hojas, fruto y sequedad",src:"assets/higuera.webp",n:2},templo:{name:"El comercio en el templo",src:"assets/templo.webp",n:3}};
const content={
entrada:{contexto:[["El pollino","Marcos describe un animal joven que nadie había montado. Su elección forma parte del relato de la entrada."],["Mantos y ramas","Marcos menciona mantos y ramas cortadas en el campo; no identifica esas ramas como palmas."],["El recorrido","El relato sitúa la aproximación desde el monte de los Olivos, Betfagé y Betania. La ruta exacta no se conoce."]],exegesis:[["El rey que llega","La escena invita a considerar las expectativas reales y la relación con Zacarías 9:9; Mateo explicita esta conexión."],["¡Hosanna!","La aclamación remite al lenguaje del Salmo 118 y a la esperanza vinculada con David."]],aplicacion:[["Expectativas","¿Cómo influyen mis expectativas en mi manera de escuchar las enseñanzas de Jesús?"],["Reconocimiento","¿Qué significa para mí reconocer la autoridad de Jesús en mis decisiones?"]]},
higuera:{contexto:[ [["Las hojas","La higuera puede desarrollar hojas y frutos en distintas etapas. El comportamiento varía con el clima y la variedad."],["Frutos tempranos","Algunas higueras desarrollan frutos tempranos. Esto ayuda a explorar el relato sin resolver por sí solo la dificultad de Marcos 11:13."],["La estación","Marcos aclara que no era tiempo de higos. La explicación botánica requiere cautela."]],[["Seca desde la raíz","El relato subraya el estado completo de la higuera cuando los discípulos vuelven a pasar."],["Dos momentos","La primera observación y la segunda están separadas por el episodio del templo."],["Comparación","El contraste entre hojas y sequedad permite reconocer el cambio descrito por Marcos."]] ],exegesis:[["Higuera–templo–higuera","Marcos intercala la intervención en el templo entre los dos episodios de la higuera. Muchos intérpretes leen ambos relatos en relación."],["Fe y oración","Jesús responde a los discípulos con enseñanzas sobre confiar en Dios y orar."],["El perdón","Marcos 11:25 vincula la oración con el perdón a los demás."]],aplicacion:[["Coherencia","¿Hay distancia entre lo que muestro exteriormente y las decisiones que tomo?"],["Oración","¿Cómo puedo cultivar una oración confiada sin tratarla como una fórmula automática?"],["Perdón","¿Hay alguna relación en la que necesite trabajar el perdón?"]]},
templo:{contexto:[ [["Las palomas","Marcos menciona específicamente a los vendedores de palomas, vinculadas con diversas ofrendas."],["Otras ofrendas","Otros textos describen animales como ovejas y bueyes; Juan 2:14 los menciona en un episodio del templo."]],[["Los cambistas","El intercambio de moneda podía facilitar pagos relacionados con el templo."],["Monedas","Las monedas de plata de Tiro son relevantes para el estudio del impuesto del templo, aunque Marcos no especifica cuáles había en cada mesa."],["Balanzas","Las pesas y balanzas eran herramientas conocidas en el comercio antiguo."]],[["Los patios","El recinto incluía amplios espacios exteriores y zonas interiores con restricciones de acceso."],["Los pórticos","El Pórtico Real estaba al sur del recinto; el llamado Pórtico de Salomón se asociaba al lado oriental."],["Ubicación de puestos","Marcos no identifica el lugar exacto de cada comerciante. La reconstrucción arquitectónica es aproximada."]] ],exegesis:[["Casa de oración","Jesús cita Isaías 56:7 y recuerda el propósito de la casa de Dios para todas las naciones."],["Cueva de ladrones","La expresión remite a Jeremías 7:11, una denuncia profética de la falsa seguridad religiosa."],["Alcance de la denuncia","Se debate si el énfasis está en abusos específicos, una crítica más amplia al culto o una señal de juicio."]],aplicacion:[["Integridad","¿Mis prácticas religiosas guardan coherencia con mi conducta?"],["Acogida","¿Contribuyo a que otras personas se sientan escuchadas y bienvenidas?"],["Prioridades","¿Qué actividades ocupan el centro de mi vida espiritual?"]]}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mode=true;function resource(kind,start){const a=assets[kind];return '<div class="resource" data-kind="'+kind+'" data-start="'+start+'"><h3>'+a.name+'</h3><p class="sub">Infografía educativa · Deslizá o usá las flechas para recorrerla.</p><div class="viewport"><div class="inner"><img alt="'+a.name+'" src="'+a.src+'"></div></div><div class="nav"><button class="prev" type="button">← Anterior</button><small class="counter"></small><button class="next" type="button">Siguiente →</button></div><div class="zoom"><label>Zoom</label><button class="minus" type="button">−</button><input aria-label="Nivel de zoom" type="range" min="100" max="250" value="100"><button class="plus" type="button">+</button><output>100%</output></div><div class="tabs"><button data-t="contexto" class="active">Contexto</button><button data-t="exegesis">Exégesis</button><button data-t="aplicacion">Aplicación</button></div><div class="chips"></div><div class="detail"></div></div>'}
function init(r){const a=assets[r.dataset.kind],data=content[r.dataset.kind],view=r.querySelector('.viewport'),inner=r.querySelector('.inner'),img=r.querySelector('img'),range=r.querySelector('input'),counter=r.querySelector('.counter');let page=+r.dataset.start,tab='contexto',choice=0;const n=a.n;function fit(){const w=view.clientWidth;const z=+range.value/100;inner.style.width=w*z*n+'px';inner.style.height=w*z*1.25+'px';img.style.width=w*z*n+'px';img.style.height=w*z*1.25+'px';view.scrollLeft=page*w*z;counter.textContent=(page+1)+' / '+n;r.querySelector('.prev').disabled=page===0;r.querySelector('.next').disabled=page===n-1;range.nextElementSibling.nextElementSibling.textContent=range.value+'%';}function panel(){const items=tab==='contexto'?(Array.isArray(data.contexto[0][0])?data.contexto[page]:data.contexto):data[tab];const chips=r.querySelector('.chips');chips.innerHTML='';items.forEach((it,i)=>{let b=document.createElement('button');b.textContent=it[0];b.className=i===choice?'active':'';b.onclick=()=>{choice=i;panel()};chips.append(b)});const item=items[Math.min(choice,items.length-1)];r.querySelector('.detail').className='detail '+tab;r.querySelector('.detail').innerHTML='<strong>'+esc(item[0])+'</strong><p>'+esc(item[1])+'</p>';r.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===tab));}function go(p){page=Math.max(0,Math.min(n-1,p));choice=0;fit();panel()}r.querySelector('.prev').onclick=()=>go(page-1);r.querySelector('.next').onclick=()=>go(page+1);r.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;choice=0;panel()});range.oninput=fit;r.querySelector('.minus').onclick=()=>{range.value=Math.max(100,+range.value-25);fit()};r.querySelector('.plus').onclick=()=>{range.value=Math.min(250,+range.value+25);fit()};let sx=0;view.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});view.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55&&+range.value===100)go(page+(d<0?1:-1))},{passive:true});img.onerror=()=>{view.insertAdjacentHTML('afterend','<p class="error">Imagen pendiente de cargar en GitHub. El texto y los controles de estudio siguen disponibles.</p>');img.onerror=null};new ResizeObserver(fit).observe(view);fit();panel()}
fetch('../../biblia/rvc/marcos.json').then(r=>{if(!r.ok)throw Error('No se pudo cargar el texto');return r.json()}).then(j=>{const verses=j.capitulos['11'];document.querySelector('#chapter').innerHTML=blocks.map(b=>'<section class="block"><h2>'+b.title+'</h2>'+Array.from({length:b.b-b.a+1},(_,i)=>{let v=b.a+i;return '<p class="verse"><sup>'+v+'</sup>'+esc(verses[v]||'')+'</p>'}).join('')+(b.kind?resource(b.kind,b.start):'')+'</section>').join('');document.querySelector('#status').textContent='Marcos 11 · Reina Valera Contemporánea (texto del lector del proyecto)';document.querySelectorAll('.resource').forEach(init)}).catch(e=>document.querySelector('#status').textContent='Error al cargar Marcos 11: '+e.message);
document.querySelector('#visual').onclick=()=>{document.querySelectorAll('.resource').forEach(e=>e.classList.remove('hidden'));document.querySelector('#visual').classList.add('active');document.querySelector('#solo').classList.remove('active')};document.querySelector('#solo').onclick=()=>{document.querySelectorAll('.resource').forEach(e=>e.classList.add('hidden'));document.querySelector('#solo').classList.add('active');document.querySelector('#visual').classList.remove('active')};
</script></body></html>
