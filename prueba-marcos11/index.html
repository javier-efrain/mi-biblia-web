<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Biblia — RVC</title>
<style>:root{--f:#07111f;--p:#0d1a2a;--p2:#122238;--t:#f4f6f8;--s:#aeb9c7;--d:#f0cf91;--b:rgba(240,207,145,.22)}*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font-family:Georgia,"Times New Roman",serif}.lector{width:min(100% - 32px,780px);margin:auto;padding:28px 0 50px}header{text-align:center;margin-bottom:24px}.marca{margin:0 0 6px;color:var(--d);font:.8rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,3.2rem);font-weight:normal}.version{margin:7px 0 0;color:var(--s);font:.85rem Arial,sans-serif}.selectores{display:grid;grid-template-columns:1fr 120px;gap:10px;padding:12px;margin-bottom:26px;background:var(--p);border:1px solid var(--b);border-radius:14px}label{display:block;margin:0 0 6px 3px;color:var(--s);font:.72rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}select{width:100%;padding:12px;border:1px solid var(--b);border-radius:9px;background:var(--p2);color:var(--t);font-size:1rem}.texto-biblico{font-size:clamp(1.12rem,2.5vw,1.25rem);line-height:1.85}.texto-biblico p{margin:0 0 1rem}.versiculo{color:var(--d);font:bold .62em Arial,sans-serif;vertical-align:super;margin-right:5px}.cargando-biblia,.error-biblia{color:var(--s);font-family:Arial,sans-serif;text-align:center;padding:30px 0}.error-biblia{color:#ffb4b4}.navegacion{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--b)}button{min-height:50px;padding:10px 14px;border:1px solid var(--b);border-radius:10px;background:var(--p);color:var(--t);cursor:pointer;font-size:.95rem}button:disabled{opacity:.35;cursor:default}.recurso-visual{margin:26px 0 30px;padding:16px 18px;background:linear-gradient(135deg,var(--p),var(--p2));border:1px solid var(--b);border-left:4px solid var(--d);border-radius:12px;font-family:Arial,sans-serif}.recurso-tipo{margin:0 0 6px!important;color:var(--d);font-size:.72rem!important;font-weight:bold;letter-spacing:.09em;text-transform:uppercase}.recurso-titulo{margin:0 0 7px!important;color:var(--t);font-size:1.05rem!important;font-weight:bold}.recurso-descripcion{margin:0 0 12px!important;color:var(--s);font-size:.9rem!important;line-height:1.5!important}.recurso-accion{display:inline-block;color:var(--d);font-size:.88rem;font-weight:bold}.recurso-leyenda{margin:12px 0 0!important;padding-top:10px;border-top:1px solid var(--b);color:var(--s);font-size:.76rem!important;line-height:1.4!important;font-style:italic}.recurso-visual[data-media]{cursor:pointer}.recurso-visual[data-media]:hover{border-color:var(--d)}.modal-recurso{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.86)}.modal-recurso.abierto{display:flex}.modal-contenido{position:relative;width:min(1200px,96vw);max-height:94vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:14px}.modal-cerrar{position:sticky;top:12px;float:right;z-index:2;margin:12px 12px -58px 0;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:rgba(7,17,31,.92);font-size:1.5rem}.modal-imagen{display:block;width:100%;height:auto}.modal-pie{padding:16px 18px 20px;font-family:Arial,sans-serif}.modal-pie strong{display:block;margin-bottom:6px;color:var(--d)}.modal-pie p{margin:0;color:var(--s);font-size:.86rem;line-height:1.5}body.modal-abierto{overflow:hidden}.recurso-linea{margin:18px 0 20px;font-family:Arial,sans-serif}.recurso-linea button{width:100%;min-height:42px;padding:9px 12px;text-align:left;border:1px solid var(--b);border-radius:9px;background:transparent;color:var(--d);font-weight:bold}.recurso-desplegado{margin:24px 0 28px;border:1px solid var(--b);border-radius:12px;overflow:hidden;background:var(--p);font-family:Arial,sans-serif}.recurso-desplegado-cabecera{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;color:var(--d);font-size:.82rem;font-weight:bold}.recurso-desplegado-cabecera button{min-height:34px;padding:5px 9px;background:transparent;font-size:.78rem}.recurso-desplegado img{display:block;width:100%;height:auto}.recurso-desplegado .recurso-leyenda{margin:0!important;padding:10px 12px!important}.recurso-desplegado.oculto img,.recurso-desplegado.oculto .recurso-leyenda{display:none}.recurso-miniatura{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;margin:20px 0 22px;padding:8px;border:1px solid var(--b);border-radius:11px;background:var(--p);font-family:Arial,sans-serif;cursor:pointer}.recurso-miniatura:hover{border-color:var(--d)}.recurso-miniatura img{width:92px;height:62px;object-fit:cover;border-radius:7px}.recurso-miniatura-titulo{margin:0 0 5px!important;color:var(--t);font-size:.9rem!important;font-weight:bold;line-height:1.25!important}.recurso-miniatura-accion{color:var(--d);font-size:.78rem;font-weight:bold}@media(max-width:420px){.recurso-miniatura{grid-template-columns:76px 1fr}.recurso-miniatura img{width:76px;height:54px}}@media(max-width:520px){.lector{width:min(100% - 24px,780px);padding-top:20px}.selectores{grid-template-columns:1fr 105px}.texto-biblico{line-height:1.75}.navegacion{gap:8px}button{font-size:.85rem}}
/* PILOTO V3: modo lectura, botones de lugares y mapa limpio */
.modo-lectura{margin:-10px 0 24px;padding:14px;background:#112239;border:1px solid var(--b);border-radius:14px;font-family:Arial,sans-serif}.modo-lectura-titulo{display:block;color:var(--d);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}.modo-lectura-opciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modo-lectura-opciones button{min-height:49px;font-weight:bold;line-height:1.3}.modo-lectura-opciones button[aria-pressed="true"]{background:#38526b;border-color:#e7c98e;color:#fff;box-shadow:inset 0 0 0 1px #e7c98e}.modo-lectura-ayuda{font-size:.77rem;color:var(--s);margin:9px 0 0;line-height:1.45}.map-places{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}.map-places button{min-height:38px;padding:7px 10px;font-size:.82rem}.map-places button.activo{border-color:var(--d);background:#344b61;color:#fff}.map-pin:focus-visible,.map-places button:focus-visible,.modo-lectura button:focus-visible{outline:3px solid #fff;outline-offset:2px}.map-viewport.mapa-limpio .map-pin{display:none}.map-places[hidden],.map-detail[hidden]{display:none!important}.map-pin{rotate:none!important;transform:translate(-50%,-50%) rotate(-45deg)!important}.map-pin::after{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
@media(max-width:430px){.modo-lectura-opciones button{padding:9px 5px;font-size:.78rem}}
/* PILOTO V2: portada, mapa desplazable, galería integrada */
.bloque-portada{margin:25px 0 16px;border-radius:15px;overflow:hidden;background:#14253b;border:1px solid var(--b);font-family:Arial,sans-serif}.bloque-portada img{width:100%;height:auto;object-fit:contain;display:block}.bloque-portada-info{padding:13px 16px}.bloque-portada-info small{display:block;color:var(--d);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}.bloque-portada-info strong{display:block;font-size:1.13rem}.bloque-portada-info p{margin:5px 0 0!important;color:var(--s);font-size:.8rem!important;line-height:1.4!important}.visual-v2{margin:24px 0 28px;background:#102036;border:1px solid var(--b);border-radius:15px;overflow:hidden;font:14px/1.5 Arial,sans-serif}.visual-head{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#182c43}.visual-head-text{flex:1;min-width:0}.visual-head small{display:block;color:var(--d);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase}.visual-head strong{display:block;color:#fff;font-size:.95rem}.visual-toggle{min-height:36px;padding:5px 10px;font-size:.78rem;white-space:nowrap}.visual-body{padding:12px}.visual-v2.cerrado .visual-body{display:none}.visual-nota{margin:10px 0 0!important;color:var(--s);font:italic .78rem/1.5 Arial,sans-serif!important}.map-viewport{position:relative;overflow:auto;max-height:440px;border-radius:10px;border:1px solid var(--b);background:#071522;touch-action:pan-x pan-y;overscroll-behavior:contain}.map-canvas{position:relative;width:100%;min-width:100%;line-height:0}.map-canvas img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.map-pin{position:absolute;transform:translate(-50%,-100%);z-index:2;min-height:0;width:29px;height:29px;padding:0;border-radius:50% 50% 50% 3px;rotate:-45deg;border:2px solid #fff;background:#bd8d4c;box-shadow:0 2px 10px #0009;cursor:pointer}.map-pin::after{content:'';display:block;width:8px;height:8px;background:white;border-radius:50%;margin:auto}.map-pin.activo{background:#298b92;outline:3px solid #ffdf9c}.map-toolbar{display:flex;align-items:center;gap:7px;margin:10px 0;flex-wrap:wrap}.map-toolbar button{min-height:36px;padding:5px 12px;font-size:.85rem}.map-toolbar .zoom-valor{color:var(--s);margin-right:auto;font-size:.78rem}.map-detail{border:1px solid var(--b);background:#1a3047;border-radius:9px;padding:11px 12px;min-height:77px}.map-detail strong{color:var(--d);display:block;margin-bottom:4px}.map-detail p{color:#e0e7ee;margin:0!important;font:.84rem/1.5 Arial,sans-serif!important}.gal-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}.gal-tabs button{min-height:45px;padding:7px 4px;font-size:.76rem;line-height:1.2}.gal-tabs button.activo{border-color:var(--d);background:#34465b;color:var(--d)}.gal-image{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#213b50}.gal-title{color:var(--d);margin:10px 0 4px!important;font:bold .92rem Arial,sans-serif!important}.gal-description{color:#d4dce6;margin:0 0 10px!important;font:.84rem/1.5 Arial,sans-serif!important}.gal-controls{display:flex;justify-content:space-between;gap:8px}.gal-controls button{min-height:36px;font-size:.8rem}.piloto-banner{margin:10px 0 22px;border:1px dashed #a98d5b;border-radius:9px;padding:10px 12px;color:#e6cfaa;font:12px/1.5 Arial,sans-serif}.visual-body .map-hint{font-size:.75rem;color:var(--s);margin:4px 0 9px!important}.texto-biblico .bloque-portada-info p{margin:5px 0 0!important}@media(max-width:520px){.map-viewport{max-height:320px}.gal-tabs button{font-size:.69rem;padding:6px 2px}.visual-body{padding:9px}.visual-head{padding:10px}.bloque-portada img{height:auto;object-fit:contain}}
</style></head>
<body><main class="lector"><header><p class="marca">Mi Biblia Web</p><h1 id="titulo">Génesis 1</h1><p class="version">Texto de demostración · Marcos 11</p></header><section class="selectores"><div><label for="libro">Libro</label><select id="libro"></select></div><div><label for="capitulo">Capítulo</label><select id="capitulo"></select></div></section><section class="modo-lectura" aria-label="Modo de lectura"><strong class="modo-lectura-titulo">Elegí cómo leer este capítulo</strong><div class="modo-lectura-opciones"><button type="button" id="modo-visual" aria-pressed="true">🗺️ Con recursos visuales</button><button type="button" id="modo-solo" aria-pressed="false">📖 Solo texto bíblico</button></div><p class="modo-lectura-ayuda" id="modo-ayuda">Portadas, mapas y galerías aparecen integrados en el capítulo.</p></section><article id="texto" class="texto-biblico"></article><nav class="navegacion"><button id="anterior">← Anterior</button><button id="siguiente">Siguiente →</button></nav></main>
<script>
const RUTA="../biblia/rvc/";const RUTA_VISUAL="./visual/";const LIBROS=[["genesis","Génesis",50],["exodo","Éxodo",40],["levitico","Levítico",27],["numeros","Números",36],["deuteronomio","Deuteronomio",34],["josue","Josué",24],["jueces","Jueces",21],["rut","Rut",4],["1-samuel","1 Samuel",31],["2-samuel","2 Samuel",24],["1-reyes","1 Reyes",22],["2-reyes","2 Reyes",25],["1-cronicas","1 Crónicas",29],["2-cronicas","2 Crónicas",36],["esdras","Esdras",10],["nehemias","Nehemías",13],["ester","Ester",10],["job","Job",42],["salmos","Salmos",150],["proverbios","Proverbios",31],["eclesiastes","Eclesiastés",12],["cantares","Cantares",8],["isaias","Isaías",66],["jeremias","Jeremías",52],["lamentaciones","Lamentaciones",5],["ezequiel","Ezequiel",48],["daniel","Daniel",12],["oseas","Oseas",14],["joel","Joel",3],["amos","Amós",9],["abdias","Abdías",1],["jonas","Jonás",4],["miqueas","Miqueas",7],["nahum","Nahúm",3],["habacuc","Habacuc",3],["sofonias","Sofonías",3],["hageo","Hageo",2],["zacarias","Zacarías",14],["malaquias","Malaquías",4],["mateo","Mateo",28],["marcos","Marcos",16],["lucas","Lucas",24],["juan","Juan",21],["hechos","Hechos",28],["romanos","Romanos",16],["1-corintios","1 Corintios",16],["2-corintios","2 Corintios",13],["galatas","Gálatas",6],["efesios","Efesios",6],["filipenses","Filipenses",4],["colosenses","Colosenses",4],["1-tesalonicenses","1 Tesalonicenses",5],["2-tesalonicenses","2 Tesalonicenses",3],["1-timoteo","1 Timoteo",6],["2-timoteo","2 Timoteo",4],["tito","Tito",3],["filemon","Filemón",1],["hebreos","Hebreos",13],["santiago","Santiago",5],["1-pedro","1 Pedro",5],["2-pedro","2 Pedro",3],["1-juan","1 Juan",5],["2-juan","2 Juan",1],["3-juan","3 Juan",1],["judas","Judas",1],["apocalipsis","Apocalipsis",22]];
const sl=document.querySelector('#libro'),sc=document.querySelector('#capitulo'),titulo=document.querySelector('#titulo'),texto=document.querySelector('#texto'),ant=document.querySelector('#anterior'),sig=document.querySelector('#siguiente');const cache={};let il=0,cap=1;let modoVisual=localStorage.getItem("biblia-modo-visual")!=="no";let capituloActual=null,visualesActuales=null;LIBROS.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l[1];sl.appendChild(o)});function caps(){sc.innerHTML='';for(let i=1;i<=LIBROS[il][2];i++){const o=document.createElement('option');o.value=i;o.textContent=i;sc.appendChild(o)}sc.value=cap}function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}async function cargarLibro(s){if(cache[s])return cache[s];const r=await fetch(RUTA+s+'.json');if(!r.ok)throw Error('No se pudo cargar '+s);return cache[s]=await r.json()}async function cargarVisual(slug,capitulo){try{const r=await fetch(`${RUTA_VISUAL}${slug}/${capitulo}.json`);if(!r.ok)return null;return await r.json()}catch(e){return null}}function etiquetaTipo(tipo){const e={mapa:"🗺️ Mapa",naturaleza:"🌿 Naturaleza",reconstruccion:"🏛️ Reconstrucción",diagrama:"🔎 Diagrama"};return e[tipo]||"◈ Recurso visual"}function portadaBloque(b){return `<section class="bloque-portada"><picture>${b.media_movil?`<source media="(max-width: 640px)" srcset="${esc(b.media_movil)}">`:""}<img loading="lazy" src="${esc(b.media)}" alt="${esc(b.alt||'Portada narrativa ilustrativa')}"></picture><div class="bloque-portada-info"><small>${esc(b.rango||'Bloque temático')}</small><strong>${esc(b.titulo||'Relato bíblico')}</strong>${b.leyenda?`<p>${esc(b.leyenda)}</p>`:''}</div></section>`}
function tarjetaRecurso(r){if(r.estado==='inactivo')return '';const id=esc(r.id||'');const tipo=r.tipo==='mapa'?'Mapa interactivo':r.tipo==='galeria'?'Galería visual':'Recurso visual';let contenido='';if(r.tipo==='mapa'){contenido=`<div class="map-viewport" tabindex="0" aria-label="Mapa ampliable y desplazable"><div class="map-canvas"><img loading="lazy" draggable="false" src="${esc(r.media||'')}" alt="${esc(r.alt||'Mapa ilustrativo')}">${(r.puntos||[]).map((p,i)=>`<button class="map-pin ${i===0?'activo':''}" type="button" style="left:${Number(p.x)||0}%;top:${Number(p.y)||0}%" data-punto="${i}" aria-label="Explorar ${esc(p.nombre)}" title="${esc(p.nombre)}"></button>`).join('')}</div></div><div class="map-toolbar"><button type="button" data-zoom="out" aria-label="Alejar">−</button><button type="button" data-zoom="in" aria-label="Acercar">+</button><button type="button" data-zoom="reset">Restablecer</button><span class="zoom-valor">100 %</span><button type="button" data-map-points="toggle" aria-pressed="true">◉ Ocultar puntos</button></div><p class="map-hint">Tocá un marcador o elegí un lugar por su nombre. Con zoom, desplazá el mapa con el dedo o mouse.</p><div class="map-places" role="group" aria-label="Lugares del mapa">${(r.puntos||[]).map((p,i)=>`<button type="button" class="map-place ${i===0?'activo':''}" data-punto="${i}" aria-pressed="${i===0?'true':'false'}">${esc(p.nombre)}</button>`).join('')}</div><div class="map-detail" aria-live="polite"><strong>${esc(r.puntos?.[0]?.nombre||'Explorá el mapa')}</strong><p>${esc(r.puntos?.[0]?.texto||'Seleccioná un punto de interés.')}</p></div>`}else if(r.tipo==='galeria'){const a=r.items||[];const item=a[0]||{};contenido=`<div class="gal-tabs">${a.map((g,i)=>`<button type="button" class="gal-tab ${i===0?'activo':''}" data-slide="${i}">${esc(g.etiqueta||g.titulo||'Imagen '+(i+1))}</button>`).join('')}</div><img class="gal-image" loading="lazy" src="${esc(item.media||'')}" alt="${esc(item.alt||'')}"><p class="gal-title">${esc(item.titulo||'')}</p><p class="gal-description">${esc(item.descripcion||'')}</p><div class="gal-controls"><button type="button" data-gal="prev" disabled>← Anterior</button><span class="gal-counter">1 de ${a.length}</span><button type="button" data-gal="next" ${a.length<2?'disabled':''}>Siguiente →</button></div>`}else{contenido=`<img class="gal-image" loading="lazy" src="${esc(r.media||'')}" alt="${esc(r.alt||'')}">`};return `<aside class="visual-v2" data-id="${id}"><div class="visual-head"><div class="visual-head-text"><small>${tipo}</small><strong>${esc(r.titulo||'Recurso visual')}</strong></div><button type="button" class="visual-toggle" aria-expanded="true">Ocultar ↑</button></div><div class="visual-body">${contenido}${r.leyenda?`<p class="visual-nota">${esc(r.leyenda)}</p>`:''}</div></aside>`}
function renderCapitulo(c,visual){if(!modoVisual)visual=null;const recursos=new Map(),portadas=new Map();if(visual&&Array.isArray(visual.recursos))for(const r of visual.recursos){const k=String(r.despues_de);if(!recursos.has(k))recursos.set(k,[]);recursos.get(k).push(r)}if(visual&&Array.isArray(visual.bloques))for(const b of visual.bloques){const k=String(b.desde);if(!portadas.has(k))portadas.set(k,[]);portadas.get(k).push(b)}return Object.entries(c).map(([n,t])=>{let h=(portadas.get(String(n))||[]).map(portadaBloque).join('');h+=`<p><sup class="versiculo">${esc(n)}</sup>${esc(t)}</p>`;h+=(recursos.get(String(n))||[]).map(tarjetaRecurso).join('');return h}).join('')}
function actualizarModo(){const visual=document.getElementById('modo-visual'),solo=document.getElementById('modo-solo'),ayuda=document.getElementById('modo-ayuda');visual.setAttribute('aria-pressed',String(modoVisual));solo.setAttribute('aria-pressed',String(!modoVisual));ayuda.textContent=modoVisual?'Portadas, mapas y galerías aparecen integrados en el capítulo.':'Lectura sin portadas ni recursos; podés activarlos cuando quieras.'}function cambiarModo(valor){if(modoVisual===valor)return;modoVisual=valor;localStorage.setItem('biblia-modo-visual',valor?'si':'no');actualizarModo();if(capituloActual)texto.innerHTML=renderCapitulo(capituloActual,visualesActuales)}document.getElementById('modo-visual').addEventListener('click',()=>cambiarModo(true));document.getElementById('modo-solo').addEventListener('click',()=>cambiarModo(false));
function botones(){ant.disabled=il===0&&cap===1;sig.disabled=il===LIBROS.length-1&&cap===LIBROS[il][2];ant.textContent=cap>1?`← ${LIBROS[il][1]} ${cap-1}`:il>0?`← ${LIBROS[il-1][1]} ${LIBROS[il-1][2]}`:'← Anterior';sig.textContent=cap<LIBROS[il][2]?`${LIBROS[il][1]} ${cap+1} →`:il<LIBROS.length-1?`${LIBROS[il+1][1]} 1 →`:'Siguiente →'}async function mostrar(url=true){const [slug,nombre]=LIBROS[il];titulo.textContent=`${nombre} ${cap}`;document.title=`${nombre} ${cap} — Biblia RVC`;sl.value=il;caps();texto.innerHTML='<p class="cargando-biblia">Cargando capítulo…</p>';try{const [b,visual]=await Promise.all([cargarLibro(slug),cargarVisual(slug,cap)]),c=b.capitulos[String(cap)];if(!c)throw Error('Capítulo inexistente');capituloActual=c;visualesActuales=visual;prepararVisuales(visual);actualizarModo();texto.innerHTML=renderCapitulo(c,visual);botones();if(url){const u=new URL(location);u.searchParams.set('libro',slug);u.searchParams.set('capitulo',cap);history.replaceState(null,'',u)}}catch(e){console.error(e);texto.innerHTML='<p class="error-biblia">No fue posible cargar este capítulo.</p>'}}function nav(d){if(d<0){if(cap>1)cap--;else if(il>0){il--;cap=LIBROS[il][2]}}else{if(cap<LIBROS[il][2])cap++;else if(il<LIBROS.length-1){il++;cap=1}}mostrar();scrollTo({top:0,behavior:'smooth'})}const datosVisuales=new Map();function prepararVisuales(visual){datosVisuales.clear();for(const r of visual?.recursos||[])datosVisuales.set(r.id,r)}function zoomMapa(card,scale){const viewport=card.querySelector('.map-viewport'),canvas=card.querySelector('.map-canvas');if(!viewport||!canvas)return;const prev=Number(card.dataset.zoom||1),next=Math.max(1,Math.min(4,scale));const rect=viewport.getBoundingClientRect();const oldW=canvas.offsetWidth,oldH=canvas.offsetHeight;const centerX=(viewport.scrollLeft+rect.width/2)/oldW,centerY=(viewport.scrollTop+rect.height/2)/oldH;card.dataset.zoom=String(next);canvas.style.width=`${next*100}%`;viewport.scrollLeft=centerX*canvas.offsetWidth-rect.width/2;viewport.scrollTop=centerY*canvas.offsetHeight-rect.height/2;card.querySelector('.zoom-valor').textContent=Math.round(next*100)+' %'}function mostrarPunto(card,index){const r=datosVisuales.get(card.dataset.id),p=r?.puntos?.[index];if(!p)return;card.querySelectorAll('.map-pin').forEach((b,i)=>{b.classList.toggle('activo',i===index);b.setAttribute('aria-pressed',String(i===index))});card.querySelectorAll('.map-place').forEach((b,i)=>{b.classList.toggle('activo',i===index);b.setAttribute('aria-pressed',String(i===index))});const detail=card.querySelector('.map-detail');detail.querySelector('strong').textContent=p.nombre;detail.querySelector('p').textContent=p.texto}function mostrarSlide(card,index){const r=datosVisuales.get(card.dataset.id),items=r?.items||[];if(!items.length)return;const i=Math.max(0,Math.min(items.length-1,index)),item=items[i];card.dataset.slide=String(i);const img=card.querySelector('.gal-image');img.src=item.media;img.alt=item.alt||'';card.querySelector('.gal-title').textContent=item.titulo||'';card.querySelector('.gal-description').textContent=item.descripcion||'';card.querySelector('.gal-counter').textContent=`${i+1} de ${items.length}`;card.querySelectorAll('.gal-tab').forEach((b,n)=>{b.classList.toggle('activo',n===i);b.setAttribute('aria-pressed',String(n===i))});card.querySelector('[data-gal="prev"]').disabled=i===0;card.querySelector('[data-gal="next"]').disabled=i===items.length-1}
texto.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const card=b.closest('.visual-v2');if(!card)return;if(b.classList.contains('visual-toggle')){const hidden=card.classList.toggle('cerrado');b.textContent=hidden?'Mostrar ↓':'Ocultar ↑';b.setAttribute('aria-expanded',String(!hidden))}else if(b.hasAttribute('data-zoom')){const z=Number(card.dataset.zoom||1);zoomMapa(card,b.dataset.zoom==='reset'?1:z+(b.dataset.zoom==='in'?.5:-.5))}else if(b.hasAttribute('data-map-points')){const vp=card.querySelector('.map-viewport'),hidden=vp.classList.toggle('mapa-limpio');card.querySelector('.map-places').hidden=hidden;card.querySelector('.map-detail').hidden=hidden;b.textContent=hidden?'◎ Mostrar puntos':'◉ Ocultar puntos';b.setAttribute('aria-pressed',String(!hidden))}else if(b.hasAttribute('data-punto'))mostrarPunto(card,Number(b.dataset.punto));else if(b.hasAttribute('data-slide'))mostrarSlide(card,Number(b.dataset.slide));else if(b.hasAttribute('data-gal'))mostrarSlide(card,Number(card.dataset.slide||0)+(b.dataset.gal==='next'?1:-1))});
// Arrastre del mapa con mouse o lápiz. En pantallas táctiles funciona el desplazamiento nativo.
let drag=null;texto.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.target.closest('.map-pin'))return;const vp=e.target.closest('.map-viewport');if(!vp||!vp.closest('.visual-v2')||Number(vp.closest('.visual-v2').dataset.zoom||1)<=1)return;drag={vp,x:e.clientX,y:e.clientY,left:vp.scrollLeft,top:vp.scrollTop};vp.style.cursor='grabbing';vp.setPointerCapture(e.pointerId)});texto.addEventListener('pointermove',e=>{if(!drag)return;drag.vp.scrollLeft=drag.left-(e.clientX-drag.x);drag.vp.scrollTop=drag.top-(e.clientY-drag.y)});for(const name of ['pointerup','pointercancel'])texto.addEventListener(name,()=>{if(drag){drag.vp.style.cursor='';drag=null}});
function leerURL(){const p=new URLSearchParams(location.search),s=p.get('libro'),c=Number(p.get('capitulo')),i=LIBROS.findIndex(l=>l[0]===s);if(i>=0)il=i;if(Number.isInteger(c)&&c>=1&&c<=LIBROS[il][2])cap=c}sl.addEventListener('change',()=>{il=Number(sl.value);cap=1;mostrar()});sc.addEventListener('change',()=>{cap=Number(sc.value);mostrar()});ant.addEventListener('click',()=>nav(-1));sig.addEventListener('click',()=>nav(1));leerURL();mostrar(false);
</script></body></html>
