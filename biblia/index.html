<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Biblia — RVC</title>
<style>:root{--f:#07111f;--p:#0d1a2a;--p2:#122238;--t:#f4f6f8;--s:#aeb9c7;--d:#f0cf91;--b:rgba(240,207,145,.22)}*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font-family:Georgia,"Times New Roman",serif}.lector{width:min(100% - 32px,780px);margin:auto;padding:28px 0 50px}header{text-align:center;margin-bottom:24px}.marca{margin:0 0 6px;color:var(--d);font:.8rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,3.2rem);font-weight:normal}.version{margin:7px 0 0;color:var(--s);font:.85rem Arial,sans-serif}.selectores{display:grid;grid-template-columns:1fr 120px;gap:10px;padding:12px;margin-bottom:26px;background:var(--p);border:1px solid var(--b);border-radius:14px}label{display:block;margin:0 0 6px 3px;color:var(--s);font:.72rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}select{width:100%;padding:12px;border:1px solid var(--b);border-radius:9px;background:var(--p2);color:var(--t);font-size:1rem}.texto-biblico{font-size:clamp(1.12rem,2.5vw,1.25rem);line-height:1.85}.texto-biblico p{margin:0 0 1rem}.versiculo{color:var(--d);font:bold .62em Arial,sans-serif;vertical-align:super;margin-right:5px}.cargando-biblia,.error-biblia{color:var(--s);font-family:Arial,sans-serif;text-align:center;padding:30px 0}.error-biblia{color:#ffb4b4}.navegacion{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--b)}button{min-height:50px;padding:10px 14px;border:1px solid var(--b);border-radius:10px;background:var(--p);color:var(--t);cursor:pointer;font-size:.95rem}button:disabled{opacity:.35;cursor:default}.recurso-visual{margin:26px 0 30px;padding:16px 18px;background:linear-gradient(135deg,var(--p),var(--p2));border:1px solid var(--b);border-left:4px solid var(--d);border-radius:12px;font-family:Arial,sans-serif}.recurso-tipo{margin:0 0 6px!important;color:var(--d);font-size:.72rem!important;font-weight:bold;letter-spacing:.09em;text-transform:uppercase}.recurso-titulo{margin:0 0 7px!important;color:var(--t);font-size:1.05rem!important;font-weight:bold}.recurso-descripcion{margin:0 0 12px!important;color:var(--s);font-size:.9rem!important;line-height:1.5!important}.recurso-accion{display:inline-block;color:var(--d);font-size:.88rem;font-weight:bold}.recurso-leyenda{margin:12px 0 0!important;padding-top:10px;border-top:1px solid var(--b);color:var(--s);font-size:.76rem!important;line-height:1.4!important;font-style:italic}.recurso-visual[data-media]{cursor:pointer}.recurso-visual[data-media]:hover{border-color:var(--d)}.modal-recurso{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.86)}.modal-recurso.abierto{display:flex}.modal-contenido{position:relative;width:min(1200px,96vw);max-height:94vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:14px}.modal-cerrar{position:sticky;top:12px;float:right;z-index:2;margin:12px 12px -58px 0;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:rgba(7,17,31,.92);font-size:1.5rem}.modal-imagen{display:block;width:100%;height:auto}.modal-pie{padding:16px 18px 20px;font-family:Arial,sans-serif}.modal-pie strong{display:block;margin-bottom:6px;color:var(--d)}.modal-pie p{margin:0;color:var(--s);font-size:.86rem;line-height:1.5}body.modal-abierto{overflow:hidden}.recurso-linea{margin:18px 0 20px;font-family:Arial,sans-serif}.recurso-linea button{width:100%;min-height:42px;padding:9px 12px;text-align:left;border:1px solid var(--b);border-radius:9px;background:transparent;color:var(--d);font-weight:bold}.recurso-desplegado{margin:24px 0 28px;border:1px solid var(--b);border-radius:12px;overflow:hidden;background:var(--p);font-family:Arial,sans-serif}.recurso-desplegado-cabecera{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;color:var(--d);font-size:.82rem;font-weight:bold}.recurso-desplegado-cabecera button{min-height:34px;padding:5px 9px;background:transparent;font-size:.78rem}.recurso-desplegado img{display:block;width:100%;height:auto}.recurso-desplegado .recurso-leyenda{margin:0!important;padding:10px 12px!important}.recurso-desplegado.oculto img,.recurso-desplegado.oculto .recurso-leyenda{display:none}.recurso-miniatura{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;margin:20px 0 22px;padding:8px;border:1px solid var(--b);border-radius:11px;background:var(--p);font-family:Arial,sans-serif;cursor:pointer}.recurso-miniatura:hover{border-color:var(--d)}.recurso-miniatura img{width:92px;height:62px;object-fit:cover;border-radius:7px}.recurso-miniatura-titulo{margin:0 0 5px!important;color:var(--t);font-size:.9rem!important;font-weight:bold;line-height:1.25!important}.recurso-miniatura-accion{color:var(--d);font-size:.78rem;font-weight:bold}@media(max-width:420px){.recurso-miniatura{grid-template-columns:76px 1fr}.recurso-miniatura img{width:76px;height:54px}}@media(max-width:520px){.lector{width:min(100% - 24px,780px);padding-top:20px}.selectores{grid-template-columns:1fr 105px}.texto-biblico{line-height:1.75}.navegacion{gap:8px}button{font-size:.85rem}}</style></head>
<body><main class="lector"><header><p class="marca">Mi Biblia Web</p><h1 id="titulo">Génesis 1</h1><p class="version">Reina Valera Contemporánea</p></header><section class="selectores"><div><label for="libro">Libro</label><select id="libro"></select></div><div><label for="capitulo">Capítulo</label><select id="capitulo"></select></div></section><article id="texto" class="texto-biblico"></article><nav class="navegacion"><button id="anterior">← Anterior</button><button id="siguiente">Siguiente →</button></nav><div id="modal-recurso" class="modal-recurso" aria-hidden="true"><div class="modal-contenido" role="dialog" aria-modal="true"><button id="modal-cerrar" class="modal-cerrar" type="button" aria-label="Cerrar">×</button><img id="modal-imagen" class="modal-imagen" src="" alt=""><div class="modal-pie"><strong id="modal-titulo"></strong><p id="modal-leyenda"></p></div></div></div></main>
<script>
const RUTA="./rvc/";const RUTA_VISUAL="./visual/";const LIBROS=[["genesis","Génesis",50],["exodo","Éxodo",40],["levitico","Levítico",27],["numeros","Números",36],["deuteronomio","Deuteronomio",34],["josue","Josué",24],["jueces","Jueces",21],["rut","Rut",4],["1-samuel","1 Samuel",31],["2-samuel","2 Samuel",24],["1-reyes","1 Reyes",22],["2-reyes","2 Reyes",25],["1-cronicas","1 Crónicas",29],["2-cronicas","2 Crónicas",36],["esdras","Esdras",10],["nehemias","Nehemías",13],["ester","Ester",10],["job","Job",42],["salmos","Salmos",150],["proverbios","Proverbios",31],["eclesiastes","Eclesiastés",12],["cantares","Cantares",8],["isaias","Isaías",66],["jeremias","Jeremías",52],["lamentaciones","Lamentaciones",5],["ezequiel","Ezequiel",48],["daniel","Daniel",12],["oseas","Oseas",14],["joel","Joel",3],["amos","Amós",9],["abdias","Abdías",1],["jonas","Jonás",4],["miqueas","Miqueas",7],["nahum","Nahúm",3],["habacuc","Habacuc",3],["sofonias","Sofonías",3],["hageo","Hageo",2],["zacarias","Zacarías",14],["malaquias","Malaquías",4],["mateo","Mateo",28],["marcos","Marcos",16],["lucas","Lucas",24],["juan","Juan",21],["hechos","Hechos",28],["romanos","Romanos",16],["1-corintios","1 Corintios",16],["2-corintios","2 Corintios",13],["galatas","Gálatas",6],["efesios","Efesios",6],["filipenses","Filipenses",4],["colosenses","Colosenses",4],["1-tesalonicenses","1 Tesalonicenses",5],["2-tesalonicenses","2 Tesalonicenses",3],["1-timoteo","1 Timoteo",6],["2-timoteo","2 Timoteo",4],["tito","Tito",3],["filemon","Filemón",1],["hebreos","Hebreos",13],["santiago","Santiago",5],["1-pedro","1 Pedro",5],["2-pedro","2 Pedro",3],["1-juan","1 Juan",5],["2-juan","2 Juan",1],["3-juan","3 Juan",1],["judas","Judas",1],["apocalipsis","Apocalipsis",22]];
const sl=document.querySelector('#libro'),sc=document.querySelector('#capitulo'),titulo=document.querySelector('#titulo'),texto=document.querySelector('#texto'),ant=document.querySelector('#anterior'),sig=document.querySelector('#siguiente');const cache={};let il=0,cap=1;LIBROS.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l[1];sl.appendChild(o)});function caps(){sc.innerHTML='';for(let i=1;i<=LIBROS[il][2];i++){const o=document.createElement('option');o.value=i;o.textContent=i;sc.appendChild(o)}sc.value=cap}function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}async function cargarLibro(s){if(cache[s])return cache[s];const r=await fetch(RUTA+s+'.json');if(!r.ok)throw Error('No se pudo cargar '+s);return cache[s]=await r.json()}async function cargarVisual(slug,capitulo){try{const r=await fetch(`${RUTA_VISUAL}${slug}/${capitulo}.json`);if(!r.ok)return null;return await r.json()}catch(e){return null}}function etiquetaTipo(tipo){const e={mapa:"🗺️ Mapa",naturaleza:"🌿 Naturaleza",reconstruccion:"🏛️ Reconstrucción",diagrama:"🔎 Diagrama"};return e[tipo]||"◈ Recurso visual"}function tarjetaRecurso(r){const modo=r.modo||"tarjeta",datos=r.media?` data-media="${esc(r.media)}" data-alt="${esc(r.alt||"")}" data-titulo="${esc(r.titulo||"")}" data-leyenda="${esc(r.leyenda||"")}"`:"";if(modo==="linea")return `<aside class="recurso-linea"${datos}><button type="button" class="abrir-recurso">${esc(r.accion||"Ver recurso")} →</button></aside>`;if(modo==="miniatura"&&r.media)return `<aside class="recurso-miniatura"${datos}><img src="${esc(r.media)}" alt=""><div><p class="recurso-miniatura-titulo">${esc(r.titulo||"Recurso visual")}</p><span class="recurso-miniatura-accion">${esc(r.accion||"Ver recurso")} →</span></div></aside>`;if(modo==="desplegado"&&r.media)return `<aside class="recurso-desplegado" data-recurso="${esc(r.id||"")}"><div class="recurso-desplegado-cabecera"><span>${etiquetaTipo(r.tipo)} · ${esc(r.titulo||"Recurso visual")}</span><button type="button" class="alternar-recurso">Ocultar ↑</button></div><img src="${esc(r.media)}" alt="${esc(r.alt||"")}">${r.leyenda?`<p class="recurso-leyenda">${esc(r.leyenda)}</p>`:""}</aside>`;return `<aside class="recurso-visual" data-recurso="${esc(r.id||"")}"${datos}><p class="recurso-tipo">${etiquetaTipo(r.tipo)}</p><p class="recurso-titulo">${esc(r.titulo||"Recurso visual")}</p>${r.descripcion?`<p class="recurso-descripcion">${esc(r.descripcion)}</p>`:""}<span class="recurso-accion">${esc(r.accion||"Ver recurso")} →</span>${r.leyenda?`<p class="recurso-leyenda">${esc(r.leyenda)}</p>`:""}</aside>`}function renderCapitulo(c,visual){const recursos=new Map();if(visual&&Array.isArray(visual.recursos)){for(const r of visual.recursos){const k=String(r.despues_de);if(!recursos.has(k))recursos.set(k,[]);recursos.get(k).push(r)}}return Object.entries(c).map(([n,t])=>{let h=`<p><sup class="versiculo">${esc(n)}</sup>${esc(t)}</p>`;const rs=recursos.get(String(n));if(rs)h+=rs.map(tarjetaRecurso).join("");return h}).join("")}function botones(){ant.disabled=il===0&&cap===1;sig.disabled=il===LIBROS.length-1&&cap===LIBROS[il][2];ant.textContent=cap>1?`← ${LIBROS[il][1]} ${cap-1}`:il>0?`← ${LIBROS[il-1][1]} ${LIBROS[il-1][2]}`:'← Anterior';sig.textContent=cap<LIBROS[il][2]?`${LIBROS[il][1]} ${cap+1} →`:il<LIBROS.length-1?`${LIBROS[il+1][1]} 1 →`:'Siguiente →'}async function mostrar(url=true){const [slug,nombre]=LIBROS[il];titulo.textContent=`${nombre} ${cap}`;document.title=`${nombre} ${cap} — Biblia RVC`;sl.value=il;caps();texto.innerHTML='<p class="cargando-biblia">Cargando capítulo…</p>';try{const [b,visual]=await Promise.all([cargarLibro(slug),cargarVisual(slug,cap)]),c=b.capitulos[String(cap)];if(!c)throw Error('Capítulo inexistente');texto.innerHTML=renderCapitulo(c,visual);botones();if(url){const u=new URL(location);u.searchParams.set('libro',slug);u.searchParams.set('capitulo',cap);history.replaceState(null,'',u)}}catch(e){console.error(e);texto.innerHTML='<p class="error-biblia">No fue posible cargar este capítulo.</p>'}}function nav(d){if(d<0){if(cap>1)cap--;else if(il>0){il--;cap=LIBROS[il][2]}}else{if(cap<LIBROS[il][2])cap++;else if(il<LIBROS.length-1){il++;cap=1}}mostrar();scrollTo({top:0,behavior:'smooth'})}const modal=document.querySelector('#modal-recurso'),modalImg=document.querySelector('#modal-imagen'),modalTitulo=document.querySelector('#modal-titulo'),modalLeyenda=document.querySelector('#modal-leyenda'),modalCerrar=document.querySelector('#modal-cerrar');function abrirRecurso(t){if(!t.dataset.media)return;modalImg.src=t.dataset.media;modalImg.alt=t.dataset.alt||'';modalTitulo.textContent=t.dataset.titulo||'';modalLeyenda.textContent=t.dataset.leyenda||'';modal.classList.add('abierto');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-abierto')}function cerrarRecurso(){modal.classList.remove('abierto');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-abierto');modalImg.src=''}texto.addEventListener('click',e=>{const modalTarget=e.target.closest('[data-media]');if(modalTarget){abrirRecurso(modalTarget);return}const b=e.target.closest('.alternar-recurso');if(b){const box=b.closest('.recurso-desplegado');box.classList.toggle('oculto');const oculto=box.classList.contains('oculto');b.textContent=oculto?'Mostrar recurso ↓':'Ocultar ↑'}});modalCerrar.addEventListener('click',cerrarRecurso);modal.addEventListener('click',e=>{if(e.target===modal)cerrarRecurso()});document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarRecurso()});function leerURL(){const p=new URLSearchParams(location.search),s=p.get('libro'),c=Number(p.get('capitulo')),i=LIBROS.findIndex(l=>l[0]===s);if(i>=0)il=i;if(Number.isInteger(c)&&c>=1&&c<=LIBROS[il][2])cap=c}sl.addEventListener('change',()=>{il=Number(sl.value);cap=1;mostrar()});sc.addEventListener('change',()=>{cap=Number(sc.value);mostrar()});ant.addEventListener('click',()=>nav(-1));sig.addEventListener('click',()=>nav(1));leerURL();mostrar(false);
</script></body></html>
