<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Biblia — RVC</title>
<style>:root{--f:#07111f;--p:#0d1a2a;--p2:#122238;--t:#f4f6f8;--s:#aeb9c7;--d:#f0cf91;--b:rgba(240,207,145,.22)}*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font-family:Georgia,"Times New Roman",serif}.lector{width:min(100% - 32px,780px);margin:auto;padding:28px 0 50px}header{text-align:center;margin-bottom:24px}.marca{margin:0 0 6px;color:var(--d);font:.8rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,3.2rem);font-weight:normal}.version{margin:7px 0 0;color:var(--s);font:.85rem Arial,sans-serif}.selectores{display:grid;grid-template-columns:1fr 120px;gap:10px;padding:12px;margin-bottom:26px;background:var(--p);border:1px solid var(--b);border-radius:14px}label{display:block;margin:0 0 6px 3px;color:var(--s);font:.72rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}select{width:100%;padding:12px;border:1px solid var(--b);border-radius:9px;background:var(--p2);color:var(--t);font-size:1rem}.texto-biblico{font-size:clamp(1.12rem,2.5vw,1.25rem);line-height:1.85}.texto-biblico p{margin:0 0 1rem}.versiculo{color:var(--d);font:bold .62em Arial,sans-serif;vertical-align:super;margin-right:5px}.cargando-biblia,.error-biblia{color:var(--s);font-family:Arial,sans-serif;text-align:center;padding:30px 0}.error-biblia{color:#ffb4b4}.navegacion{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--b)}button{min-height:50px;padding:10px 14px;border:1px solid var(--b);border-radius:10px;background:var(--p);color:var(--t);cursor:pointer;font-size:.95rem}button:disabled{opacity:.35;cursor:default}@media(max-width:520px){.lector{width:min(100% - 24px,780px);padding-top:20px}.selectores{grid-template-columns:1fr 105px}.texto-biblico{line-height:1.75}.navegacion{gap:8px}button{font-size:.85rem}}</style></head>
<body><main class="lector"><header><p class="marca">Mi Biblia Web</p><h1 id="titulo">Génesis 1</h1><p class="version">Reina Valera Contemporánea</p></header><section class="selectores"><div><label for="libro">Libro</label><select id="libro"></select></div><div><label for="capitulo">Capítulo</label><select id="capitulo"></select></div></section><article id="texto" class="texto-biblico"></article><nav class="navegacion"><button id="anterior">← Anterior</button><button id="siguiente">Siguiente →</button></nav></main>
<script>
const RUTA="./rvc/";const LIBROS=[["genesis","Génesis",50],["exodo","Éxodo",40],["levitico","Levítico",27],["numeros","Números",36],["deuteronomio","Deuteronomio",34],["josue","Josué",24],["jueces","Jueces",21],["rut","Rut",4],["1-samuel","1 Samuel",31],["2-samuel","2 Samuel",24],["1-reyes","1 Reyes",22],["2-reyes","2 Reyes",25],["1-cronicas","1 Crónicas",29],["2-cronicas","2 Crónicas",36],["esdras","Esdras",10],["nehemias","Nehemías",13],["ester","Ester",10],["job","Job",42],["salmos","Salmos",150],["proverbios","Proverbios",31],["eclesiastes","Eclesiastés",12],["cantares","Cantares",8],["isaias","Isaías",66],["jeremias","Jeremías",52],["lamentaciones","Lamentaciones",5],["ezequiel","Ezequiel",48],["daniel","Daniel",12],["oseas","Oseas",14],["joel","Joel",3],["amos","Amós",9],["abdias","Abdías",1],["jonas","Jonás",4],["miqueas","Miqueas",7],["nahum","Nahúm",3],["habacuc","Habacuc",3],["sofonias","Sofonías",3],["hageo","Hageo",2],["zacarias","Zacarías",14],["malaquias","Malaquías",4],["mateo","Mateo",28],["marcos","Marcos",16],["lucas","Lucas",24],["juan","Juan",21],["hechos","Hechos",28],["romanos","Romanos",16],["1-corintios","1 Corintios",16],["2-corintios","2 Corintios",13],["galatas","Gálatas",6],["efesios","Efesios",6],["filipenses","Filipenses",4],["colosenses","Colosenses",4],["1-tesalonicenses","1 Tesalonicenses",5],["2-tesalonicenses","2 Tesalonicenses",3],["1-timoteo","1 Timoteo",6],["2-timoteo","2 Timoteo",4],["tito","Tito",3],["filemon","Filemón",1],["hebreos","Hebreos",13],["santiago","Santiago",5],["1-pedro","1 Pedro",5],["2-pedro","2 Pedro",3],["1-juan","1 Juan",5],["2-juan","2 Juan",1],["3-juan","3 Juan",1],["judas","Judas",1],["apocalipsis","Apocalipsis",22]];
const sl=document.querySelector('#libro'),sc=document.querySelector('#capitulo'),titulo=document.querySelector('#titulo'),texto=document.querySelector('#texto'),ant=document.querySelector('#anterior'),sig=document.querySelector('#siguiente');const cache={};let il=0,cap=1;LIBROS.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l[1];sl.appendChild(o)});function caps(){sc.innerHTML='';for(let i=1;i<=LIBROS[il][2];i++){const o=document.createElement('option');o.value=i;o.textContent=i;sc.appendChild(o)}sc.value=cap}function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}async function cargarLibro(s){if(cache[s])return cache[s];const r=await fetch(RUTA+s+'.json');if(!r.ok)throw Error('No se pudo cargar '+s);return cache[s]=await r.json()}function botones(){ant.disabled=il===0&&cap===1;sig.disabled=il===LIBROS.length-1&&cap===LIBROS[il][2];ant.textContent=cap>1?`← ${LIBROS[il][1]} ${cap-1}`:il>0?`← ${LIBROS[il-1][1]} ${LIBROS[il-1][2]}`:'← Anterior';sig.textContent=cap<LIBROS[il][2]?`${LIBROS[il][1]} ${cap+1} →`:il<LIBROS.length-1?`${LIBROS[il+1][1]} 1 →`:'Siguiente →'}async function mostrar(url=true){const [slug,nombre]=LIBROS[il];titulo.textContent=`${nombre} ${cap}`;document.title=`${nombre} ${cap} — Biblia RVC`;sl.value=il;caps();texto.innerHTML='<p class="cargando-biblia">Cargando capítulo…</p>';try{const b=await cargarLibro(slug),c=b.capitulos[String(cap)];if(!c)throw Error('Capítulo inexistente');texto.innerHTML=Object.entries(c).map(([n,t])=>`<p><sup class="versiculo">${esc(n)}</sup>${esc(t)}</p>`).join('');botones();if(url){const u=new URL(location);u.searchParams.set('libro',slug);u.searchParams.set('capitulo',cap);history.replaceState(null,'',u)}}catch(e){console.error(e);texto.innerHTML='<p class="error-biblia">No fue posible cargar este capítulo.</p>'}}function nav(d){if(d<0){if(cap>1)cap--;else if(il>0){il--;cap=LIBROS[il][2]}}else{if(cap<LIBROS[il][2])cap++;else if(il<LIBROS.length-1){il++;cap=1}}mostrar();scrollTo({top:0,behavior:'smooth'})}function leerURL(){const p=new URLSearchParams(location.search),s=p.get('libro'),c=Number(p.get('capitulo')),i=LIBROS.findIndex(l=>l[0]===s);if(i>=0)il=i;if(Number.isInteger(c)&&c>=1&&c<=LIBROS[il][2])cap=c}sl.addEventListener('change',()=>{il=Number(sl.value);cap=1;mostrar()});sc.addEventListener('change',()=>{cap=Number(sc.value);mostrar()});ant.addEventListener('click',()=>nav(-1));sig.addEventListener('click',()=>nav(1));leerURL();mostrar(false);
</script></body></html>
